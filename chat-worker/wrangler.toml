name = "rufistofeles-cv-chat"
main = "worker.js"
compatibility_date = "2026-08-03"

# Deliberately NOT a custom domain. A route on chat.rufistofeles.dev would
# require moving the domain's nameservers to Cloudflare, and rufistofeles.dev is
# on Google Cloud DNS with live Zoho MX records — that is the address on the CV.
# The workers.dev URL costs nothing and risks no mail.
#
# NOTE: top-level keys must stay ABOVE the [table] headers below. Put this line
# after them and TOML reads it as a field of that table instead — which is
# exactly what happened the first time, and wrangler warned rather than failed.
workers_dev = true

# Workers AI. The free allocation is a hard stop, not a meter: past 10,000
# Neurons/day the API errors and asks you to upgrade, so a Free-plan account
# cannot be billed. The Worker also caps its own spend — see NEURON_BUDGET.
[ai]
binding = "AI"

# Rate limiting and the daily budget counter both live here.
# Create it once:  wrangler kv namespace create CHAT_KV
# then paste the printed id below.
[[kv_namespaces]]
binding = "CHAT_KV"
id = "5656bf1dbf9f480096458cfba672fcaa"
